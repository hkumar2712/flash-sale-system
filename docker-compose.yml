services:
  postgres:
    image: postgres:17-alpine
    container_name: flashsale-postgres
    environment:
      POSTGRES_DB: flashsale_users
      POSTGRES_USER: flashsale
      POSTGRES_PASSWORD: flashsale_dev_pw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashsale -d flashsale_users"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: user-service
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: flashsale_users
      DB_USER: flashsale
      DB_PASSWORD: flashsale_dev_pw

volumes:
  postgres_data: